<!doctype html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مكتبة صغار الباحثين | Young Researchers' Library</title>
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@500;600;700&display=swap">
</head>
<body>
<header class="mast">
  <div class="wrap">
    <div class="mast-row">
      <div class="brand">
        <h1>مكتبة صغار الباحثين</h1>
        <small>المكتبة الحقوقية الشاملة</small>
      </div>
      <div class="search-box">
        <input id="q" type="search" placeholder="ابحث في التقارير والوثائق..." autocomplete="off">
        <span class="search-icon">🔍</span>
      </div>
      <button class="theme-toggle" id="theme-toggle" aria-label="تغيير المظهر">
        <span id="theme-icon">🌙</span>
      </button>
    </div>
    <nav class="tabs" role="tablist">
      <button class="tab" role="tab" data-v="home" aria-selected="true">لوحة المتابعة</button>
      <button class="tab" role="tab" data-v="reports">الأبحاث والتقارير</button>
      <button class="tab" role="tab" data-v="library">أقسام المكتبة</button>
      <button class="tab" role="tab" data-v="rights">دليل الحقوق</button>
    </nav>
  </div>
</header>
<main class="wrap" id="main" aria-live="polite">
    <!-- المحتوى يحقن هنا ديناميكياً -->
</main>
<footer class="wrap" style="text-align:center; padding: 20px 0; border-top: 1px solid var(--line); color: var(--muted); margin-top: 40px;">
  <p>منصة مكتبة صغار الباحثين - تحديث 2026. الأولوية للمعلومة القانونية الدقيقة.</p>
</footer>
<script src="app.js"></script>
</body>
</html>
